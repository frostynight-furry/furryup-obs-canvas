<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FurryUP OBS Canvas</title><link rel="stylesheet" href="/base.css"><link rel="stylesheet" href="/obs-layout-editor.css"><script src="/layout.cjs" defer></script><script src="/registry.js" defer></script><script src="/vendor/interactjs/interact.min.js" defer></script><script src="/demo-host.js" defer></script><script src="/obs-layout-editor.js" defer></script></head><body><header><h1>FurryUP OBS Canvas</h1><p>0.2.0 预览版 · 示例内容 · 真实直播待验证</p></header><main><section id="obs-layout-editor" class="console-card">
<div class="layout-header"><div><h2>互动合成画布</h2><p class="subtle">在这里摆好直播互动，OBS 只需添加一个浏览器源。</p></div><button id="layout-expand" type="button" class="secondary">展开／收起大画布</button></div>
<div class="layout-toolbar"><div class="actions"><button type="button" data-layout-orientation="landscape" aria-pressed="true">横屏 1920 × 1080</button><button type="button" data-layout-orientation="portrait" aria-pressed="false">竖屏 1080 × 1920</button></div><div class="actions"><button id="layout-apply" type="button" disabled>应用到直播</button><button id="layout-copy" type="button" disabled>复制当前画布源</button></div><span id="layout-size">1920 × 1080</span><span id="layout-draft-state" class="quiet-badge">已应用到直播</span></div>
<div class="layout-workspace"><div><div id="layout-stage-wrap" class="layout-stage-wrap"><div id="layout-stage-space" class="layout-stage-space"><div id="layout-stage" class="layout-stage"></div></div></div><p class="layout-draft-note">示例预览，不播放真实互动。拖动模块移动位置，拖动右下角调整大小；锁定模块可从右侧选择。</p></div><aside class="layout-sidebar"><div><h3>画面模块</h3><p class="layout-help">越靠上越在前；拖动手柄排序，锁定模块需先解锁。</p><div class="layout-layer-actions" aria-label="调整层级"><button type="button" class="secondary" data-layer-action="top">置顶</button><button type="button" class="secondary" data-layer-action="bottom">置底</button><button type="button" class="secondary" data-layer-action="up">上移</button><button type="button" class="secondary" data-layer-action="down">下移</button></div><ol id="layout-layers"></ol></div><div><h3 id="layout-selected-title">点歌台</h3><div id="layout-properties"><label><span>左侧位置</span><input type="number" min="0" step="1" data-layout-field="x"></label><label><span>顶部位置</span><input type="number" min="0" step="1" data-layout-field="y"></label><label><span>宽度</span><input type="number" min="80" step="1" data-layout-field="width"></label><label><span>高度</span><input type="number" min="60" step="1" data-layout-field="height"></label><label><span>层级</span><input type="number" min="0" max="20" step="1" data-layout-field="layer"></label></div><label class="inline-toggle"><input id="layout-snap" type="checkbox" checked><span>移动后对齐 10 像素网格</span></label></div></aside></div>
<div class="layout-toolbar"><div class="actions"><button id="layout-undo" type="button" class="secondary" disabled>撤销调整</button><button id="layout-reload" type="button" class="secondary">载入直播布局</button><button id="layout-reset" type="button" class="secondary">恢复默认布局</button></div></div>
<p id="layout-status" role="status" class="layout-help">两种方向分别保存；编辑只影响预览，应用后才更新直播。</p><p class="layout-help">OBS 浏览器源的宽高请使用上方尺寸。合成源背景透明，不包含音乐声音和 iPhone 投屏。</p>
<div class="layout-toolbar"><button id="canvas-check" type="button" class="secondary">检查输出连接</button><p id="canvas-connection" role="status" class="layout-help">等待连接状态</p></div></section></main></body></html>
